<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ethics News Archive</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;600;700&family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css">
</head>
<body data-view="archive">
  <div class="page-shell">
    <header class="masthead">
      <div class="masthead-copy">
        <p class="eyebrow">Ethics News Archive</p>
        <h1 id="archive-title">Monthly archive</h1>
        <p id="last-updated" class="subcopy">Loading archive...</p>
      </div>
      <nav class="archive-nav" aria-label="Archive months">
        <a class="archive-link current-link" href="../index.html">Current</a>
        <div id="archive-links" class="archive-link-list"></div>
      </nav>
    </header>

    <section class="toolbar panel">
      <div class="filter-group">
        <span class="group-label">Region</span>
        <div class="chip-row">
          <button class="chip active" type="button" data-filter-group="region" data-filter-value="all">All</button>
          <button class="chip" type="button" data-filter-group="region" data-filter-value="us">US</button>
          <button class="chip" type="button" data-filter-group="region" data-filter-value="non-us">Non-US</button>
        </div>
      </div>
      <div class="filter-group">
        <span class="group-label">Tone</span>
        <div class="chip-row">
          <button class="chip active" type="button" data-filter-group="sentiment" data-filter-value="all">All</button>
          <button class="chip" type="button" data-filter-group="sentiment" data-filter-value="positive">Good / Green</button>
          <button class="chip" type="button" data-filter-group="sentiment" data-filter-value="negative">Bad / Red</button>
        </div>
      </div>
      <div class="filter-group">
        <span class="group-label">View</span>
        <div class="chip-row">
          <button class="chip active" type="button" data-filter-group="column" data-filter-value="all">Both columns</button>
          <button class="chip" type="button" data-filter-group="column" data-filter-value="government">Government only</button>
          <button class="chip" type="button" data-filter-group="column" data-filter-value="nonprofit">Nonprofit only</button>
        </div>
      </div>
    </section>

    <section class="analysis-grid">
      <article class="panel stat-card">
        <p class="eyebrow">Visible Stories</p>
        <div id="visible-count" class="stat-value">0</div>
      </article>
      <article class="panel stat-card">
        <p class="eyebrow">US vs Non-US</p>
        <div id="region-breakdown" class="stat-copy">US 0 | Non-US 0</div>
      </article>
      <article class="panel stat-card">
        <p class="eyebrow">Green vs Red</p>
        <div id="sentiment-breakdown" class="stat-copy">Green 0 | Red 0</div>
      </article>
      <article class="panel stat-card themes-card">
        <p class="eyebrow">Common Themes</p>
        <div id="theme-list" class="theme-list"></div>
      </article>
    </section>

    <main class="columns">
      <section id="government-column" class="column panel">
        <div class="column-heading">
          <h2>Government</h2>
          <span id="government-count" class="count-pill">0</span>
        </div>
        <div id="government-list" class="tiles" aria-live="polite"></div>
      </section>

      <section id="nonprofit-column" class="column panel">
        <div class="column-heading">
          <h2>Nonprofit</h2>
          <span id="nonprofit-count" class="count-pill">0</span>
        </div>
        <div id="nonprofit-list" class="tiles" aria-live="polite"></div>
      </section>
    </main>
  </div>

  <script src="../app.js"></script>
</body>
</html>
